Dir {
  ArchiveDir "/home/ubuntu/vibos/repository";
};
Default {
  Packages::Compress ". gzip";
};
TreeDefault {
  BinCacheDB "";
  Directory "pool/main";
  Packages "dists/trixie/main/binary-$(ARCH)/Packages";
};
Tree "dists/trixie" {
  Sections "main";
  Architectures "amd64";
};
APT::FTPArchive::Release::Origin "VibOS";
APT::FTPArchive::Release::Label "VibOS Official Repository";
APT::FTPArchive::Release::Suite "trixie";
APT::FTPArchive::Release::Codename "trixie";
APT::FTPArchive::Release::Architectures "amd64";
APT::FTPArchive::Release::Components "main";
